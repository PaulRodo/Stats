<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключение TikTok</title>
<style>
:root{--bg:#f4f5f9;--ink:#171a33;--mute:#62667f;--line:#d3d6e3;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12142a;--ink:#eceefa;--mute:#9a9ebb;--line:#2b2f52;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 20px}
h1{font-size:24px;margin:0 0 6px}
p{color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:16px 0 4px}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
textarea{height:110px;word-break:break-all}
button{font:inherit;font-weight:700;margin-top:14px;padding:10px 18px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
code{background:rgba(127,127,127,.18);padding:2px 6px;border-radius:5px;word-break:break-all}
.err{color:#c0392b}
</style>
</head>
<body>
<main>
<h1>Подключение TikTok</h1>
<div id="box"></div>
<script>
const box = document.getElementById('box');
const redirect = location.origin + location.pathname;
const q = new URLSearchParams(location.search);
const el = (t, a, ...k) => { const e = document.createElement(t); for (const x in (a || {})) e.setAttribute(x, a[x]); k.forEach(c => e.append(c)); return e; };
let saved = null; try { saved = sessionStorage.getItem('tt_state'); } catch (e) {}

if (q.has('code')) {
  const ta = el('textarea', { readonly: '', 'aria-label': 'Код авторизации' }); ta.value = q.get('code');
  const btn = el('button', { type: 'button' }, 'Скопировать код');
  btn.onclick = () => { ta.select(); try { navigator.clipboard.writeText(ta.value); btn.textContent = 'Скопировано'; } catch (e) { document.execCommand('copy'); } };
  box.append(el('p', {}, 'Готово. Скопируйте код и вставьте его в запуск «update-stats» на GitHub (Actions → Run workflow). Код действует несколько минут и работает один раз.'), ta, btn);
  if (saved && q.get('state') !== saved) box.append(el('p', { class: 'err' }, 'Внимание: параметр state не совпал. Если вы сами не начинали вход, не используйте этот код.'));
} else if (q.has('error')) {
  box.append(el('p', { class: 'err' }, 'TikTok вернул ошибку: ' + (q.get('error_description') || q.get('error'))), el('p', {}, el('a', { href: redirect }, 'Начать заново')));
} else {
  const key = el('input', { id: 'key', autocomplete: 'off', placeholder: 'Client key приложения TikTok' });
  const btn = el('button', { type: 'button' }, 'Войти через TikTok');
  btn.onclick = () => {
    const k = key.value.trim(); if (!k) { key.focus(); return; }
    const s = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem('tt_state', s); } catch (e) {}
    const u = 'https://www.tiktok.com/v2/auth/authorize/?' + new URLSearchParams({
      client_key: k, scope: 'user.info.basic,user.info.stats,video.list', response_type: 'code', redirect_uri: redirect, state: s });
    location.href = u;
  };
  box.append(el('p', {}, 'Вставьте Client key (не Client secret) и нажмите кнопку. После входа в TikTok вы вернётесь сюда и получите код.'),
    el('label', { for: 'key' }, 'Client key'), key, btn,
    el('p', {}, 'Этот адрес нужно указать в TikTok как Redirect URI: ', el('code', {}, redirect)));
}
</script>
</main>
</body>
</html>
