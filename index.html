<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Статистика каналов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f6;--card:#fff;--ink:#14172b;--mute:#7a7f99;--line:#e7e9f2;--chip:#f1f3f9;--up:#14a05a;--down:#e5484d;--acc:#6c5ce7;
--sh:0 1px 2px rgba(20,23,43,.04),0 8px 24px rgba(20,23,43,.06);color-scheme:light}
:root[data-theme=dark]{--card:color-mix(in srgb,var(--bg) 86%,#fff);--chip:color-mix(in srgb,var(--bg) 76%,#fff);--line:color-mix(in srgb,var(--bg) 70%,#fff);--ink:#eef0fb;--mute:#9a9fbb;--up:#3ddc84;--down:#ff6b70;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
-webkit-font-smoothing:antialiased;padding:max(16px,var(--sat,env(safe-area-inset-top,0px))) 16px calc(28px + env(safe-area-inset-bottom))}
main{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid #2aa5ee;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 16px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.acts{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:18px;flex:none}
.round.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--sh);min-width:0}
.hero,.posts,.plats,.wide{grid-column:1/-1}
.lbl{color:var(--mute);font-size:13px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.row>div:first-child{min-width:0}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.chipline{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--mute);white-space:nowrap}
.chip.up{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.chip.down{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.seg{display:flex;background:var(--chip);border-radius:99px;padding:3px;flex:none}
.seg button{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.readout{min-height:20px;margin-top:10px;font-size:13px;color:var(--mute)}
.readout b{color:var(--ink)}
.chart{height:150px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.stat{color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:132px}
.stat .lbl{color:rgba(255,255,255,.92)}
.stat .val{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .note{font-size:12px;color:rgba(255,255,255,.92)}
.grow{background:linear-gradient(135deg,var(--acc),#f26b3a)}
.er{background:linear-gradient(150deg,#1faa59,#0c8a45)}
.plats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.plats .plat:last-child:nth-child(odd){grid-column:1/-1}
.plat{padding:14px 16px;cursor:pointer;background:linear-gradient(135deg,color-mix(in srgb,var(--g,transparent) 16%,var(--card)),var(--card) 62%)}
.pname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.bdg{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;flex:none}
.bdg svg{width:16px;height:16px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pnum{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.pmeta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;margin-top:6px;font-size:12px;color:var(--mute)}
.pmeta b{color:var(--ink);font-weight:600}
.plat .spark{height:38px;margin-top:8px}
.perr{font-size:12px;color:var(--down);margin-top:8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ptitle h2,.card h2{margin:0;font-size:17px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:500;background:var(--chip);color:var(--mute)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.post{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.post:first-of-type{border-top:0}
.post.lnk{cursor:pointer}
.post .t{font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.post .m{font-size:12px;color:var(--mute);margin-top:1px}
.post .v{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.post .v small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
footer{color:var(--mute);font-size:12px;text-align:center;margin:18px 0 0}
@media(min-width:760px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero{grid-column:span 2}
.plats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.plats .plat:last-child:nth-child(odd){grid-column:auto}
.stat{min-height:0}
}
.lock{grid-column:1/-1;max-width:340px;width:100%;margin:10vh auto 0;text-align:center}
.lock input[type=password]{width:100%;padding:13px 14px;font:inherit;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin:14px 0 8px}
.lock label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--mute);margin:6px 0 10px}
.lock .go{width:100%;padding:13px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700}
.lock .bad{color:var(--down);font-size:13px;min-height:18px}
.back{grid-column:1/-1;justify-self:start;font-size:14px;color:var(--mute)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
.tile{background:var(--chip);border-radius:16px;padding:12px 14px;min-width:0}
.tile b{display:block;font-size:20px;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--mute)}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sk{border-radius:24px;background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sh 1.3s ease-in-out infinite}
@keyframes sh{to{background-position:-200% 0}}
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0 10px}
.sbar span{min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.leg .dot{margin-right:6px}
.wk{display:flex;gap:8px;height:120px;margin-top:12px}
.wc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.wbw{flex:1;display:flex;align-items:flex-end;width:100%}
.wb{width:100%;background:var(--chip);border-radius:8px 8px 4px 4px;transition:height .6s cubic-bezier(.2,.7,.2,1)}
.wb.best{background:var(--acc)}
.hm{display:grid;grid-template-columns:30px repeat(8,1fr);gap:4px;margin-top:12px;font-size:11px;color:var(--mute);align-items:center}
.hm i{height:22px;border-radius:6px;background:var(--chip)}
.hm i.thin{opacity:.45;outline:1px dashed var(--line)}
.fm{margin-top:12px}
.fm .row{font-size:14px;align-items:baseline}
.fb{height:10px;border-radius:99px;background:var(--chip);margin-top:6px;overflow:hidden}
.fb i{display:block;height:100%;border-radius:99px}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:8px;border-radius:16px}
.sw[aria-pressed=true]{background:var(--chip);color:var(--ink)}
.swc{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.srow .g1{flex:1;font-weight:500}
.mv{width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--mute)}
.tgl{padding:6px 14px;border-radius:99px;background:var(--chip);color:var(--mute);font-size:13px;font-weight:600}
.tgl[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sec{margin:18px 0 2px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.35s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ptr{position:fixed;top:6px;left:50%;width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;opacity:0;pointer-events:none;z-index:40;transform:translate(-50%,-40px)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
.anim>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.draw .area{animation:fade .9s both}
.heat{overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}.heat svg{display:block}
#tools{padding:0 4px 14px}.tbtn{border:0;background:var(--chip);color:var(--ink);border-radius:14px;padding:9px 14px;font:inherit;font-size:13px;margin:4px 4px 0 0}
body.fs{padding-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
@keyframes fade{from{opacity:0}}
::view-transition-group(*){animation-duration:.32s}
.compact .card{padding:12px;border-radius:18px}
.compact .big{font-size:34px}
.compact .spark{display:none}
.compact .stat{min-height:96px}
.compact .grid{gap:8px}
@media(prefers-reduced-motion:reduce){.anim>*,.draw .area,.round.spin,.sk,.arr,.hot .spark svg,.hero.hot .chart svg{animation:none}.wb{transition:none}#bgfx{display:none}#splash .ln,#splash .ln2{animation:none;stroke-dashoffset:0}#sp-hi,#sp-num,#sp-dot{animation:none;opacity:1}}
.calm .anim>*,.calm .area,.calm .sk{animation:none}

main{position:relative;z-index:1}
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bgfx i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 62%);opacity:.13;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
#bgfx i:nth-child(1){left:-22vmax;top:-18vmax}
#bgfx i:nth-child(2){right:-26vmax;top:30vh;animation-duration:32s;animation-delay:-8s;opacity:.1}
#bgfx i:nth-child(3){left:10vw;bottom:-30vmax;animation-duration:38s;animation-delay:-15s;opacity:.11}
:root[data-theme=dark] #bgfx i{opacity:.2}
@keyframes drift{to{transform:translate3d(9vmax,6vmax,0) scale(1.12)}}
.compact #bgfx,.calm #bgfx{display:none}
.paused #bgfx i{animation-play-state:paused}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .55s ease,visibility .55s}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}
#splash svg{width:84px;height:84px;overflow:visible}
#splash .ring{fill:none;stroke:var(--acc);stroke-width:2.2;opacity:.28}
#splash .ln{fill:none;stroke:var(--acc);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.1s .15s ease forwards}
#splash .ln2{stroke-dasharray:30;stroke-dashoffset:30;animation-delay:1s;animation-duration:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
#sp-hi{font-size:22px;font-weight:700;letter-spacing:-.02em;opacity:0;animation:fadeup .6s .5s ease forwards}
#sp-num{font-size:40px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-height:48px;opacity:0;animation:fadeup .6s .8s ease forwards}
#sp-dot{width:10px;height:10px;border-radius:50%;background:var(--acc);margin-top:6px;animation:pulse 1.1s ease-in-out infinite}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.calm #splash .ln,.calm #splash .ln2{animation:none;stroke-dashoffset:0}
.calm #sp-hi,.calm #sp-num,.calm #sp-dot{animation:none;opacity:1}
#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,28,.45);opacity:0;visibility:hidden;transition:.25s}
#sheet.on{opacity:1;visibility:visible}
#sheet .pan{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(30px);transition:.28s cubic-bezier(.2,.7,.2,1)}
#sheet.on .pan{transform:none}
#sheet h3{margin:2px 4px 10px;font-size:17px}
#sheet .it{display:block;width:100%;text-align:left;padding:14px 12px;border-radius:14px;font-weight:600;font-size:15px}
#sheet .it:active{background:var(--chip)}
.prow{display:flex;align-items:baseline;gap:8px}
.arr{color:var(--up);font-weight:800;font-size:18px;display:inline-block;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 6px var(--g,var(--acc)))}}
.hot .spark svg,.hero.hot .chart svg{animation:glow 2.2s ease-in-out infinite}
.calm .arr,.calm .hot .spark svg,.calm .hero.hot .chart svg{animation:none}
.plat{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.t3{background:linear-gradient(135deg,#2aa5ee,#6c5ce7)}.t4{background:linear-gradient(135deg,#f26b3a,#e63e7a)}.t5{background:linear-gradient(135deg,#12b3a8,#2aa5ee)}
.stat.w2{grid-column:1/-1}
@media(min-width:760px){.stat.w2{grid-column:span 2}}
.nav{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}
.cal .dn{color:var(--mute);font-size:11px;padding-bottom:2px}
.cal button,.cal i{height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mute);position:relative}
.cal i.void{background:none}
.cal i.gap{outline:1px dashed var(--line);outline-offset:-1px;background:none}
.cal button.p{background:color-mix(in srgb,var(--acc) 30%,var(--chip));color:var(--ink);font-weight:600}
.cal button.s{background:var(--acc);color:#fff;font-weight:700}
.cal button.s::after{content:"★";position:absolute;top:1px;right:4px;font-size:8px}
.cal .today{box-shadow:inset 0 0 0 2px var(--ink)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.mv[disabled]{opacity:.35}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;overflow:hidden;flex:none}
.avatar img,#prof img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#prof{overflow:hidden;font-size:15px;font-weight:700;padding:0}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.ins+.ins{border-top:1px solid var(--line)}
.ins .dot{margin-top:6px}
.wch{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;border-radius:99px;background:var(--chip);font-size:13px;margin:0 6px 6px 0}
.wch b{color:var(--up)}.wch.dn b{color:var(--down)}
.srcrow{margin-top:10px}
.hint{color:var(--mute);font-size:12px;margin-top:10px}
.small{font-size:13px}
header h1{font-size:20px}
.acts{gap:6px}
.acts .round{width:38px;height:38px}
.chipline .chip{white-space:normal}

</style>
</head>
<body>
<div id="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
<header>
<div><h1 id="hello">Статистика</h1><p class="sub" id="subt">Ваши каналы в одном месте</p></div>
<div class="acts">
<button class="round" id="share" aria-label="Поделиться">↗</button>
<button class="round" id="prof" aria-label="Профиль">👤</button>
<button class="round" id="pal" aria-label="Настройки">⚙️</button>
<button class="round" id="refresh" aria-label="Обновить">↻</button>
</div>
</header>
<div class="grid" id="app"><div class="sk wide" style="height:230px"></div><div class="sk" style="height:132px"></div><div class="sk" style="height:132px"></div></div>
<footer id="foot"></footer>
<div id="tools"></div>
</main>
<div id="ptr" aria-hidden="true">↻</div>
<div id="toast" role="status"></div>
<canvas id="cf" aria-hidden="true"></canvas>
<div id="sheet"><div class="pan"></div></div>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28"/><path class="ln" d="M12 42 L24 30 L33 37 L50 18"/><path class="ln ln2" d="M41 18 H50 V27"/></svg><div id="sp-hi"></div><div id="sp-num"></div><i id="sp-dot"></i></div>
<script>
(() => {
const tg = window.Telegram && Telegram.WebApp;
try { if (tg) { tg.ready(); tg.expand(); if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } } catch (e) {}
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} return null; };
const RMQ = matchMedia('(prefers-reduced-motion: reduce)'); let RM = RMQ.matches;
let LANG = 'ru';
const tap = () => { try { if (CFG.hap) tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const hap = t => { try { if (CFG.hap) tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const okh = () => { try { if (CFG.hap) tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} };
let AC = null;
function beep(kind) {
  if (!CFG.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.resume) AC.resume();
    (kind === 'viral' ? [660, 880, 990] : [523, 784]).forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.13; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.3); });
  } catch (e) {}
}
const EN = {

  glow(160, 200, 760, '66'); glow(960, 1560, 820, '48');
  const T = (s, px, py, font, col, al) => { x.font = font; x.fillStyle = col; x.textAlign = al || 'left'; x.fillText(s, px, py); };
  T(L('Итоги недели'), 90, 190, F('700 66px'), '#fff');
  if (n > 1) T(day(sr.dates[i0]) + ' – ' + day(sr.dates[n - 1]), 90, 256, F('500 40px'), 'rgba(255,255,255,.6)');
  T(nf.format(total), 90, 470, F('800 190px'), '#fff');
  T(L('подписчиков'), 96, 540, F('500 44px'), 'rgba(255,255,255,.65)');
  if (g) {
    const txt = sgn(g.d) + (g.pct !== null ? ' · ' + pct(g.pct) : '') + ' ' + L('за 7 дней'); x.font = F('700 44px');
    const w = x.measureText(txt).width + 64, col = g.d >= 0 ? '#3ddc84' : '#ff6b70';
    x.fillStyle = g.d >= 0 ? 'rgba(61,220,132,.18)' : 'rgba(255,107,112,.18)'; x.beginPath(); x.roundRect(90, 590, w, 84, 42); x.fill();
    T(txt, 122, 650, F('700 44px'), col);
  }
  const vals = sr.total.slice(i0);
  if (vals.length > 1) {
    const X0 = 90, X1 = 990, Y0 = 790, Y1 = 1090, mn = Math.min(...vals), mxv = Math.max(...vals), span = mxv - mn, rng = Math.max(span, 3), off = (rng - span) / 2;
    const pts = vals.map((v, i) => [X0 + i * (X1 - X0) / (vals.length - 1), Y1 - (v - mn + off) / rng * (Y1 - Y0)]);
    const dd = curve(pts), lg = x.createLinearGradient(0, Y0, 0, Y1 + 40); lg.addColorStop(0, A + '66'); lg.addColorStop(1, A + '00');

    x.strokeStyle = A; x.lineWidth = 9; x.lineCap = 'round'; x.lineJoin = 'round'; x.stroke(new Path2D(dd));

  }
  ids.slice(0, 4).forEach((id, i) => {
    const y = 1230 + i * 118, a = sr.per[id], pg = a && n > 1 ? growth(a, sr.dates, 7) : null;
    x.fillStyle = P[id][1]; x.beginPath(); x.arc(112, y - 16, 22, 0, 7); x.fill();
    T(P[id][0], 160, y, F('600 52px'), '#fff'); T(short(d.platforms[id].followers), 990, y, F('800 58px'), '#fff', 'right');
    if (pg) T(sgn(pg.d), 990, y + 46, F('600 36px'), pg.d >= 0 ? '#3ddc84' : '#ff6b70', 'right');
  });
  const lim = Date.now() - 7 * 864e5, tp = collectPosts(d).filter(p => ids.includes(p.id) && p.date && dt(p.date).getTime() > lim && typeof p.val === 'number').sort((a, b) => b.val - a.val)[0];
  if (tp) {
    T(L('🔥 Лучшая публикация'), 90, 1700, F('600 40px'), 'rgba(255,255,255,.6)');
    const words = cut(tp.title || '', 70).split(' '); let line = '', ly = 1766;
    x.font = F('600 50px'); x.fillStyle = '#fff'; x.textAlign = 'left';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > 900 && line) { if (ly < 1830) x.fillText(line, 90, ly); ly += 62; line = w; } else line = t; });
    if (line && ly < 1830) x.fillText(line, 90, ly);
    T(short(tp.val) + ' ' + (typeof tp.views === 'number' ? L('просмотров') : L('лайков')), 90, ly + 70 > 1880 ? 1880 : ly + 70, F('800 46px'), A);
  }
  return c;
}
async function makeStory() {

  toast(L('Готовлю картинку…'));
  try { await document.fonts.load('800 40px Onest'); } catch (e) {}

  if (!blob) { toast(L('Не удалось создать картинку')); return; }
  const url = URL.createObjectURL(blob);
  const img = h('img', { src: url, alt: '', style: 'width:100%;max-height:52vh;object-fit:contain;border-radius:16px;margin:4px 0 10px;background:var(--chip)' });
  openSheet(L('Итоги недели'), [

// ---------- загрузка ----------
const mskHour = () => { try { return +new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Europe/Moscow' }).format(new Date()); } catch (e) { return (new Date().getUTCHours() + 3) % 24; } };
const hello = () => { const hr = mskHour(); return L(hr < 5 ? 'Доброй ночи' : hr < 12 ? 'Доброе утро' : hr < 18 ? 'Добрый день' : 'Добрый вечер'); };
function greet() { const u = tgUser(); document.getElementById('hello').textContent = hello() + (u && u.first_name ? ', ' + u.first_name : '') + ' 👋'; }
function applyLang() {
  document.documentElement.lang = LANG; document.title = L('Статистика каналов');
  document.getElementById('subt').textContent = L('Ваши каналы в одном месте');
  [['share', 'Поделиться'], ['prof', 'Профиль'], ['pal', 'Настройки'], ['refresh', 'Обновить']].forEach(([i, t]) => document.getElementById(i).setAttribute('aria-label', L(t)));
  greet();
}
function setLang(l, silent) { LANG = l === 'en' ? 'en' : 'ru'; DN = DNL[LANG]; CFG.lang = LANG; applyLang(); if (!silent) saveCfg(); }
const SP = document.getElementById('splash'), spT0 = Date.now(); let spOn = false, spFrom = 0;
function splashInit() {
  const seen = +(ls('seenAt') || 0);
  if (seen && Date.now() - seen < 120000) { SP.style.display = 'none'; return; }
  spOn = true; spFrom = +(ls('lastTotal') || 0);
  const u = tgUser(); document.getElementById('sp-hi').textContent = hello() + (u && u.first_name ? ', ' + u.first_name : '');
  document.getElementById('sp-num').textContent = spFrom ? nf.format(spFrom) : '';
  setTimeout(() => splashDone(null), 7000);
}
function splashDone(total) {
  if (!spOn) return; spOn = false;
  const el = document.getElementById('sp-num'), wait = typeof total === 'number' ? Math.max(0, 1300 - (Date.now() - spT0)) : 0, from = spFrom;
  const fin = () => setTimeout(() => SP.classList.add('off'), 450);
  setTimeout(() => {
    if (typeof total !== 'number' || RM || from === total) { if (typeof total === 'number') el.textContent = nf.format(total); fin(); return; }
    const t0 = performance.now();
    const step = t => { const k = Math.min((t - t0) / 800, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = nf.format(Math.round(from + (total - from) * e)); k < 1 ? requestAnimationFrame(step) : fin(); };
    requestAnimationFrame(step);
  }, wait);
}
const btn = document.getElementById('refresh');
async function decrypt(box, pw) {
  const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(box.salt), iterations: box.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(box.iv) }, key, b(box.ct))));
}
async function unlock(box) {
  const saved = ls('pw');
  if (saved) { try { S.data = await decrypt(box, saved); S.warn = ''; render(); return; } catch (e) { /* пароль сменили */ } }
  const pw = h('input', { type: 'password', placeholder: L('Пароль'), autocomplete: 'current-password', 'aria-label': L('Пароль') });
  const rem = h('input', { type: 'checkbox', checked: '' }), bad = h('div', { class: 'bad' }), ok = h('button', { class: 'go', type: 'button' }, L('Открыть'));
  const submit = async () => {
    bad.textContent = ''; ok.disabled = true;
    try { S.data = await decrypt(box, pw.value); S.warn = ''; if (rem.checked) ls('pw', pw.value); render(); checkMilestones(); splashDone(curTotal()); }
    catch (e) { bad.textContent = L('Неверный пароль'); ok.disabled = false; }
  };
  ok.onclick = submit; pw.onkeydown = e => { if (e.key === 'Enter') submit(); };
  document.getElementById('app').replaceChildren(h('div', { class: 'lock' }, h('div', { style: 'font-size:40px' }, '🔒'), h('h1', {}, L('Статистика закрыта')),
    h('div', { class: 'sub' }, L('Введите пароль, чтобы открыть')), pw, h('label', {}, rem, L('Запомнить на этом устройстве')), bad, ok));
  pw.focus();
}
async function load(manual) {
  btn.classList.add('spin');
  const get = u => fetch(u + '?t=' + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); });
  try {
    const box = await get('data.enc').catch(() => null);
    if (box) { ls('box', JSON.stringify(box)); await unlock(box); }
    else { S.data = await get('data.json'); S.warn = ''; render(); }
    if (S.data) { checkMilestones(); if (manual) okh(); }
  } catch (e) {
    if (S.data) { S.warn = 'не удалось обновить, показаны прошлые данные'; foot(); }
    else document.getElementById('app').replaceChildren(h('p', { class: 'empty' }, L('Данных пока нет. Запустите обновление на GitHub: вкладка Actions, «update-stats», «Run workflow».')));
  }
  btn.classList.remove('spin');
  splashDone(S.data ? curTotal() : null);
}
btn.onclick = () => { tap(); load(true); };
document.getElementById('share').onclick = () => { tap(); openSheet(L('Поделиться'), [[L('Отправить текстом'), share], [L('Картинка для сторис'), makeStory]]); };

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.data) { fresh = false; render(); } }, 200); });

setInterval(() => ls('seenAt', String(Date.now())), 20000);

(() => {
  const box = document.getElementById('tools'); if (!tg || !box) return;

// работа без сети: служебный скрипт sw.js (если браузер поддерживает)
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

// потянуть вниз, чтобы обновить
(() => {
  const el = document.getElementById('ptr'); let y0 = null, dy = 0;
  addEventListener('touchstart', e => { y0 = scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { el.style.opacity = Math.min(dy / 80, 1); el.style.transform = `translate(-50%,${Math.min(dy / 2, 50)}px) rotate(${dy * 3}deg)`; }
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 !== null && dy > 90 && S.view !== 'set') { hap('medium'); load(true); }
    y0 = null; el.style.opacity = 0; el.style.transform = 'translate(-50%,-40px)';
  }, { passive: true });
})();
// свайп влево и вправо между платформами
(() => {
  let sx = 0, sy = 0, st = 0, ok = false;
  addEventListener('touchstart', e => { const t = e.touches[0]; ok = e.touches.length === 1 && !!S.data && !['home', 'set', 'prof'].includes(S.view) && !e.target.closest('.chart,.hm,.cal,#sheet,input'); sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
  addEventListener('touchend', e => {
    if (!ok) return; ok = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || Date.now() - st > 600) return;
    const order = vis(Object.keys(S.data.platforms)), i = order.indexOf(S.view), j = i + (dx < 0 ? 1 : -1);
    if (i < 0 || j < 0 || j >= order.length) return;
    hap('light'); go(order[j]);
  }, { passive: true });
})();

(async () => {
  setLang(LANG, true); applyTheme(); splashInit();
  try { document.getElementById('prof').replaceChildren(avatarEl(40)); } catch (e) {}
  insets();

  if (CFG.full && fsOk() && !tg.isFullscreen) fsApply(true);
  cloudPull();
  // мгновенный показ из кэша: хранится зашифрованный файл, расшифровка паролем устройства
  const cb = ls('box'), pw = ls('pw');
  if (cb && pw) { try { S.data = await decrypt(JSON.parse(cb), pw); render(); } catch (e) {} }
