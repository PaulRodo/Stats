name: update-stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tiktok_code:
        description: "Код авторизации TikTok (только при первом подключении)"
        required: false
        default: ""
      instagram_code:
        description: "Код авторизации Instagram (только при первом подключении)"
        required: false
        default: ""
      youtube_code:
        description: "Код авторизации YouTube Analytics (только при первом подключении)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: TikTok first-time authorization
        if: ${{ inputs.tiktok_code != '' }}
        run: python tiktok_auth.py
        env:
          TT_CODE: ${{ inputs.tiktok_code }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_STATE_KEY: ${{ secrets.TT_STATE_KEY }}
          TT_REDIRECT_URI: https://paulrodo.github.io/Stats/tiktok.html
          SUMMARY_KEY: ${{ secrets.SUMMARY_KEY }}
      - name: Instagram first-time authorization
        if: ${{ inputs.instagram_code != '' }}
        run: python ig_auth.py
        env:
          IG_CODE: ${{ inputs.instagram_code }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TT_STATE_KEY: ${{ secrets.TT_STATE_KEY }}
          IG_REDIRECT_URI: https://paulrodo.github.io/Stats/
      - name: YouTube Analytics first-time authorization
        if: ${{ inputs.youtube_code != '' }}
        run: python yt_auth.py
        env:
          YT_CODE: ${{ inputs.youtube_code }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TT_STATE_KEY: ${{ secrets.TT_STATE_KEY }}
          YT_REDIRECT_URI: https://paulrodo.github.io/Stats/
      - name: Collect stats
        run: python collector.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL: ${{ secrets.YT_CHANNEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_ALERT_CHAT: ${{ secrets.TG_ALERT_CHAT }}
          NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          NOTIFY_DAILY: ${{ vars.NOTIFY_DAILY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_STATE_KEY: ${{ secrets.TT_STATE_KEY }}
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
      - name: Save results
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add -A
          git commit -m "Update stats" || exit 0
          git push
